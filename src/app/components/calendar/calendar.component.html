<div class="page">
  <header class="page-header">
    <div>
      <h1>Calendar</h1>
      <p class="muted">Click a day to add a task, click a task to open it, or drag it to change its deadline.</p>
    </div>
    <button class="btn btn-primary" (click)="addTaskOn('')">+ New task</button>
  </header>

  <app-stats-bar [stats]="stats" />

  <div class="card calendar">
    <div class="legend">
      @for (status of statuses; track status.value) {
        <span class="legend-item status-{{ status.value }}">
          <span class="dot"></span>
          {{ status.label }} ({{ taskStore.countByStatus(status.value) }})
        </span>
      }
    </div>

    <full-calendar [options]="options" />
  </div>
</div>

@if (formOpen) {
  <app-task-form [deadline]="newDeadline" (closed)="formOpen = false" />
}
