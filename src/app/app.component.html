<nav class="navbar">
  <div class="navbar-inner">
    <a routerLink="/tasks" class="brand">
      <span class="brand-logo">✓</span>
      Task Manager
    </a>
    <div class="nav-links">
      <a routerLink="/tasks" routerLinkActive="active">Tasks</a>
      <a routerLink="/calendar" routerLinkActive="active">Calendar</a>
    </div>
  </div>
</nav>

@if (error) {
  <div class="error-banner" role="alert">
    <span>⚠️ {{ error }}</span>
    <button class="btn btn-ghost btn-sm" (click)="dismissError()">Dismiss</button>
  </div>
}

<main>
  <router-outlet />
</main>
