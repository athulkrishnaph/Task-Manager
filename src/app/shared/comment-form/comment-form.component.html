<form class="comment-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="field">
    <input formControlName="author" placeholder="Your name" aria-label="Your name" />
    <app-field-error [control]="form.controls.author" label="Name" />
  </div>
  <div class="field">
    <textarea
      formControlName="content"
      rows="3"
      [placeholder]="parentId ? 'Write a reply...' : 'Write a comment...'"
      aria-label="Comment"
    ></textarea>
    <app-field-error [control]="form.controls.content" label="Comment" />
  </div>
  <div class="actions">
    @if (parentId) {
      <button type="button" class="btn btn-ghost btn-sm" (click)="done.emit()">Cancel</button>
    }
    <button type="submit" class="btn btn-primary btn-sm" [disabled]="saving">
      {{ saving ? 'Posting...' : parentId ? 'Reply' : 'Post comment' }}
    </button>
  </div>
</form>
